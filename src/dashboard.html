<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bl — backlog board</title>
<style>
  :root {
    color-scheme: light dark;

    /* Neutrals, biased cool-green toward the accent */
    --paper:    #E9EEEB;
    --surface:  #FAFCFB;
    --surface-2:#F1F5F3;
    --line:     #D2DBD6;
    --line-soft:#E1E8E4;
    --ink:      #131A17;
    --ink-2:    #48564F;
    --ink-3:    #6E7D75;

    --accent:      #14655A;
    --accent-soft: #D6E6E1;
    --mark:        #F6E7A6;

    /* Status semantics — separate from the accent */
    --s-new:      #64748B;
    --s-new-bg:   #E5E9ED;
    --s-ready:    #14655A;
    --s-ready-bg: #D6E6E1;
    --s-prog:     #9A6510;
    --s-prog-bg:  #F3E6CB;
    --s-done:     #7C8A83;
    --s-done-bg:  #E6EBE8;
    --s-block:    #A6403A;
    --s-block-bg: #F1DEDC;

    /* Priority heat ramp */
    --heat-cold: #7C93A0;
    --heat-hot:  #B8452F;

    --shadow: 0 1px 2px rgba(19, 26, 23, 0.06);
    --shadow-2: 0 4px 14px rgba(19, 26, 23, 0.10);

    --radius: 4px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --header-h: 96px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:    #0D1311;
      --surface:  #141B18;
      --surface-2:#19221E;
      --line:     #26312C;
      --line-soft:#1E2822;
      --ink:      #E4EBE7;
      --ink-2:    #9DACA5;
      --ink-3:    #74847C;

      --accent:      #4FBFA9;
      --accent-soft: #14302A;
      --mark:        #5A4A12;

      --s-new:      #93A4B5;
      --s-new-bg:   #1D262D;
      --s-ready:    #4FBFA9;
      --s-ready-bg: #12302A;
      --s-prog:     #DCA53F;
      --s-prog-bg:  #322610;
      --s-done:     #6C7B74;
      --s-done-bg:  #1B2320;
      --s-block:    #D9736C;
      --s-block-bg: #2E1F1E;

      --heat-cold: #61818F;
      --heat-hot:  #E06A4E;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --paper:    #0D1311;
    --surface:  #141B18;
    --surface-2:#19221E;
    --line:     #26312C;
    --line-soft:#1E2822;
    --ink:      #E4EBE7;
    --ink-2:    #9DACA5;
    --ink-3:    #74847C;

    --accent:      #4FBFA9;
    --accent-soft: #14302A;
    --mark:        #5A4A12;

    --s-new:      #93A4B5;
    --s-new-bg:   #1D262D;
    --s-ready:    #4FBFA9;
    --s-ready-bg: #12302A;
    --s-prog:     #DCA53F;
    --s-prog-bg:  #322610;
    --s-done:     #6C7B74;
    --s-done-bg:  #1B2320;
    --s-block:    #D9736C;
    --s-block-bg: #2E1F1E;

    --heat-cold: #61818F;
    --heat-hot:  #E06A4E;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-2: 0 6px 18px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  button, select, input {
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 9px;
  }
  button, select { cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.quiet {
    background: transparent;
    border-color: transparent;
    color: var(--ink-3);
  }
  button.quiet:hover { color: var(--accent); border-color: var(--line); }
  button.quiet[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 5px;
    line-height: 1.5;
    background: var(--surface-2);
  }

  /* ---------- header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .bar, .tools {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 10px 22px;
  }
  .bar { padding-bottom: 6px; }
  .tools { padding-top: 0; padding-bottom: 10px; gap: 8px 14px; }

  .wordmark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.02em;
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
  }
  .wordmark .slash { color: var(--accent); }
  .wordmark .scope { color: var(--accent); font-weight: 600; }
  .wordmark .scope[hidden] { display: none; }
  #projectpick {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    padding: 2px 6px;
    border-color: transparent;
    background: transparent;
    max-width: 40ch;
  }
  #projectpick:hover, #projectpick[aria-expanded="true"] { border-color: var(--line); }
  #projectpick .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #projectpick .caret { font-size: 10px; color: var(--ink-3); }

  .dbpath {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    max-width: 46ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* Truncate from the left so the filename end of the path stays visible;
       the inner <bdi> keeps the path itself reading left-to-right. */
    direction: rtl;
  }
  .dbpath bdi { unicode-bidi: isolate; }

  .spacer { flex: 1; }

  .pulse {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid transparent;
    cursor: default;
  }
  .pulse.reload { cursor: pointer; }
  .pulse.reload:hover { border-color: var(--line); color: var(--accent); }
  .pulse i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    display: block;
  }
  .pulse.beat i { animation: beat 1s ease-out; }
  /* A snapshot isn't live — say so rather than implying a heartbeat. */
  .pulse.frozen i { background: var(--ink-3); }
  @keyframes beat {
    0% { transform: scale(2.6); opacity: 0.35; }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse.beat i { animation: none; }
    .card, .card:hover { transition: none; transform: none; }
  }

  /* ---------- toolbar ---------- */

  .search {
    position: relative;
    flex: 1 1 260px;
    max-width: 520px;
    display: flex;
    align-items: center;
  }
  .search input {
    width: 100%;
    padding: 6px 60px 6px 30px;
    background: var(--surface-2);
    border-color: var(--line-soft);
  }
  .search input:focus { background: var(--surface); border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
  .search input::placeholder { color: var(--ink-3); }
  .search svg {
    position: absolute;
    left: 9px;
    width: 14px; height: 14px;
    color: var(--ink-3);
    pointer-events: none;
  }
  .search kbd { position: absolute; right: 8px; pointer-events: none; }
  .search .clear {
    position: absolute;
    right: 32px;
    padding: 0 5px;
    line-height: 1.2;
    font-size: 12px;
  }
  .search .clear[hidden] { display: none; }

  .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .field select { padding: 5px 7px; font-size: 13px; }

  .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .count[hidden] { display: none; }
  .count button { padding: 1px 7px; font-size: 11px; }

  /* ---------- summary strip ---------- */

  main { padding: 16px 22px 40px; }

  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .tile {
    background: var(--surface);
    padding: 9px 13px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tile .v {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .tile .sub { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- distributions ---------- */

  .panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .panels[hidden] { display: none; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 15px 15px;
  }
  .panel h2 { margin: 0 0 11px; font: inherit; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar-row {
    display: grid;
    grid-template-columns: 11ch 1fr 4ch;
    align-items: center;
    gap: 10px;
  }
  .bar-row .name {
    font-family: var(--mono);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink-2);
  }
  .track {
    height: 7px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .track > div { height: 100%; border-radius: 999px; }
  .bar-row .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    text-align: right;
    color: var(--ink-2);
  }
  .bar-row.pick { cursor: pointer; }
  .bar-row.pick:hover .name { color: var(--accent); }
  .bar-row.on .name { color: var(--accent); font-weight: 600; }

  .hist {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 74px;
  }
  .hist > div {
    flex: 1;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    position: relative;
  }
  .hist-axis {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  /* ---------- board ---------- */

  .board {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(215px, 1fr));
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 1000px) {
    .board { grid-template-columns: repeat(2, minmax(215px, 1fr)); }
  }
  @media (max-width: 620px) {
    .board { grid-template-columns: 1fr; }
    main { padding: 12px 16px 32px; }
    .bar, .tools { padding-left: 16px; padding-right: 16px; }
  }

  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 2px 8px;
    border-bottom: 2px solid var(--col);
    margin-bottom: 10px;
    position: sticky;
    top: var(--header-h);
    background: var(--paper);
    z-index: 5;
  }
  .col-head .label { color: var(--col); }
  .col-head .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-3);
    margin-left: auto;
  }
  .col-head .n b { color: var(--ink-2); font-weight: 600; }

  .stack { display: flex; flex-direction: column; gap: 8px; }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    border-left: 3px solid var(--heat);
    box-shadow: var(--shadow);
    padding: 8px 11px 9px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: inherit;
    transition: box-shadow 0.12s ease, transform 0.12s ease;
  }
  .card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); border-color: var(--line); }
  .card:hover .title { color: var(--accent); }
  .card[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--accent), var(--shadow); }
  .card.done { opacity: 0.82; }
  .card.done .title { color: var(--ink-2); }

  .card .top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .card .id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .card .proj {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .card .proj:hover { text-decoration: underline; }
  .card .pri {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-2);
    margin-left: auto;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .card .pri i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--heat);
    display: inline-block;
  }
  .card .title {
    font-size: 13.5px;
    line-height: 1.38;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .card .snippet {
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-2);
    border-left: 2px solid var(--line);
    padding-left: 7px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow-wrap: anywhere;
  }
  .card .meta {
    display: flex;
    align-items: center;
    gap: 4px 6px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .card .meta:empty { display: none; }

  /* Tags read as quiet words, not badges; more than three fold into "+n". */
  .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    background: var(--surface-2);
    border-radius: 3px;
    padding: 0 5px;
    line-height: 1.6;
    max-width: 14ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tag:hover { color: var(--accent); background: var(--accent-soft); }
  .tag.on { color: var(--accent); background: var(--accent-soft); }
  .tag.more { max-width: none; }

  .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--line-soft);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.agent { background: var(--s-prog-bg); color: var(--s-prog); border-color: transparent; }
  .chip.block { background: var(--s-block-bg); color: var(--s-block); border-color: transparent; }
  .ago { font-size: 10.5px; color: var(--ink-3); margin-left: auto; white-space: nowrap; }

  .empty {
    padding: 14px 2px;
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
  }

  /* ---------- detail rail ---------- */

  .rail {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(460px, 94vw);
    background: var(--surface);
    border-left: 1px solid var(--line);
    padding: 20px 22px 40px;
    overflow-y: auto;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: var(--shadow-2);
  }
  .rail[hidden] { display: none; }
  .rail .close { position: absolute; top: 14px; right: 16px; }
  .rail .head { display: flex; align-items: center; gap: 8px; padding-right: 42px; }
  .rail h2 {
    margin: 0;
    font-size: 18px;
    line-height: 1.3;
    text-wrap: balance;
    padding-right: 42px;
    overflow-wrap: anywhere;
  }
  .status {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 999px;
    color: var(--sc);
    background: var(--sbg);
  }
  .kv {
    display: grid;
    grid-template-columns: 10ch 1fr;
    gap: 5px 12px;
    font-size: 12px;
    margin: 0;
  }
  .kv dt { color: var(--ink-3); font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding-top: 2px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .block h3 { margin: 0 0 6px; font: inherit; display: flex; align-items: center; gap: 8px; }
  .block h3 .copy { margin-left: auto; padding: 0 7px; font-size: 11px; }
  .block pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
  }
  .block pre.cli { font-family: var(--mono); font-size: 12px; }
  .notes { display: flex; flex-direction: column; gap: 8px; }
  .note {
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 8px 11px 9px;
    font-size: 13px;
    line-height: 1.5;
  }
  .note .who {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    margin-bottom: 3px;
  }
  .note .who b { color: var(--ink-2); font-weight: 600; }
  .note .body { white-space: pre-wrap; word-break: break-word; }
  .note .sha { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 4px; }
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.28);
    z-index: 25;
  }
  .scrim[hidden] { display: none; }

  .banner {
    background: var(--s-prog-bg);
    color: var(--s-prog);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .banner[hidden] { display: none; }

  /* ---------- projects menu ---------- */

  .menuwrap { position: relative; }
  .menuwrap[hidden] { display: none; }
  #projectsbtn b { color: var(--s-prog); font-weight: 600; }
  .menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    width: min(340px, calc(100vw - 32px));
    max-height: min(70vh, 560px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-2);
    padding: 10px 0 8px;
    z-index: 35;
  }
  .menu[hidden] { display: none; }
  .menu .mhead {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px 8px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 4px;
  }
  .menu .mhead .label { margin-right: auto; }
  .menu .mhead button { padding: 1px 7px; font-size: 11px; }
  .menu label.row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 9px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .menu label.row:hover { background: var(--surface-2); }
  .menu label.row input { margin: 0; accent-color: var(--accent); }
  .menu label.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu label.row.off .nm { color: var(--ink-3); text-decoration: line-through; }
  .menu label.row .n { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .menu .cli {
    padding: 8px 12px 2px;
    margin-top: 4px;
    border-top: 1px solid var(--line-soft);
    font-size: 11.5px;
    color: var(--ink-2);
  }
  .menu .cli code { font-family: var(--mono); font-size: 11px; color: var(--ink); }
  .menu .cli ul { margin: 4px 0 0; padding-left: 16px; }
  .menu .mnote { padding: 6px 12px 0; font-size: 11px; color: var(--ink-3); }

  /* The project switcher: a popover that always opens downward, where a
     native <select> on macOS centres on the current option and runs off the
     top of the window. */
  .menu.pick { left: 0; right: auto; width: min(320px, calc(100vw - 32px)); padding: 8px 0 6px; }
  .menu.pick input {
    display: block;
    width: calc(100% - 16px);
    margin: 0 8px 6px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .menu.pick .opt {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .menu.pick .opt .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu.pick .opt .n { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .menu.pick .opt:hover, .menu.pick .opt.active { background: var(--surface-2); }
  .menu.pick .opt[aria-selected="true"] .nm { color: var(--accent); font-weight: 600; }
  .menu.pick .opt.off .nm { color: var(--ink-3); }
  .menu.pick .opt.all { border-bottom: 1px solid var(--line-soft); margin-bottom: 4px; padding-bottom: 7px; }
  .menu.pick .none { padding: 6px 12px; font-size: 12px; color: var(--ink-3); }

  .bar-row { position: relative; }
  .bar-row .x {
    position: absolute;
    right: -6px;
    padding: 0 5px;
    font-size: 11px;
    line-height: 1.3;
    opacity: 0;
  }
  .bar-row:hover .x, .bar-row .x:focus-visible { opacity: 1; }
  .bar-row:hover .n { visibility: hidden; }

  .help {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-2);
    padding: 18px 22px;
    z-index: 40;
    min-width: 280px;
  }
  .help[hidden] { display: none; }
  .help h3 { margin: 0 0 10px; font: inherit; }
  .help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; align-items: center; }
  .help dd { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>

<header id="header">
  <div class="bar">
    <div class="wordmark">bl<span class="slash">/</span><span class="scope" id="scope">board</span></div>
    <div class="menuwrap" id="projectpickwrap" hidden>
      <button id="projectpick" aria-haspopup="listbox" aria-expanded="false" title="Switch project (g)"><span class="nm" id="projectpicklabel">all projects</span><span class="caret">▾</span></button>
      <div class="menu pick" id="projectpickmenu" hidden>
        <input id="projectfilter" type="text" placeholder="Filter projects…" autocomplete="off" spellcheck="false" aria-label="Filter projects" aria-controls="projectlist" />
        <div id="projectlist" role="listbox" aria-label="Project"></div>
      </div>
    </div>
    <select id="dbpick" aria-label="Database"></select>
    <div class="dbpath" id="dbpath" title=""></div>
    <div class="spacer"></div>
    <button class="pulse label" id="pulse" title=""><i></i><span id="pulsetext">live</span></button>
    <button class="quiet" id="helptoggle" title="Keyboard shortcuts (?)">?</button>
    <button class="quiet" id="themetoggle" title="Toggle light / dark">◐</button>
  </div>
  <div class="tools">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search title, notes, tags, #id…" autocomplete="off" spellcheck="false" aria-label="Search cards" />
      <button class="clear quiet" id="qclear" hidden aria-label="Clear search">✕</button>
      <kbd>/</kbd>
    </div>
    <label class="field"><span class="label">tag</span>
      <select id="labelpick" aria-label="Filter by tag"><option value="">all</option></select>
    </label>
    <label class="field"><span class="label">sort</span>
      <select id="sortpick" aria-label="Sort cards">
        <option value="priority">priority</option>
        <option value="updated">recently updated</option>
        <option value="created">newest</option>
      </select>
    </label>
    <label class="field"><span class="label">done</span>
      <select id="donepick" aria-label="Done cards shown">
        <option value="20">last 20</option>
        <option value="60">last 60</option>
        <option value="0">hide</option>
        <option value="99999">all</option>
      </select>
    </label>
    <span class="count" id="count" hidden></span>
    <div class="spacer"></div>
    <div class="menuwrap" id="projectswrap" hidden>
      <button class="quiet" id="projectsbtn" aria-haspopup="true" aria-expanded="false" title="Choose which projects this page shows (p)">projects</button>
      <div class="menu" id="projectsmenu" hidden role="dialog" aria-label="Projects shown"></div>
    </div>
    <button class="quiet" id="chartstoggle" aria-pressed="false" title="Show or hide the charts (c)">charts</button>
  </div>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section class="strip" id="strip" aria-label="Summary"></section>

  <div class="panels" id="panels" hidden>
    <section class="panel" id="projectpanel" hidden>
      <h2 class="label">Open cards by project</h2>
      <div class="bars" id="projectbars"></div>
    </section>
    <section class="panel">
      <h2 class="label">Open cards by tag</h2>
      <div class="bars" id="labelbars"></div>
    </section>
    <section class="panel">
      <h2 class="label">Open priority distribution</h2>
      <div class="hist" id="hist"></div>
      <div class="hist-axis">
        <span class="label">0</span><span class="label">5000</span><span class="label">10000</span>
      </div>
    </section>
  </div>

  <section class="board" id="board" aria-label="Board"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="rail" id="rail" hidden aria-label="Card detail"></aside>
<div class="help" id="help" hidden role="dialog" aria-label="Keyboard shortcuts">
  <h3 class="label">Keyboard</h3>
  <dl>
    <dt><kbd>/</kbd></dt><dd>search</dd>
    <dt><kbd>Enter</kbd></dt><dd>open the first match</dd>
    <dt><kbd>Esc</kbd></dt><dd>close the card, then clear the search</dd>
    <dt><kbd>c</kbd></dt><dd>show or hide the charts</dd>
    <dt><kbd>g</kbd></dt><dd>switch project</dd>
    <dt><kbd>p</kbd></dt><dd>choose which projects are shown</dd>
    <dt><kbd>r</kbd></dt><dd>reload a file:// snapshot</dd>
    <dt><kbd>?</kbd></dt><dd>this help</dd>
  </dl>
</div>

<script id="bldata" type="application/json">null</script>
<script>
(() => {
  "use strict";

  // `bl export` bakes the cards into the block above; when it holds data this
  // page is a snapshot and never talks to a server.
  const BOOT = JSON.parse(document.getElementById("bldata").textContent);
  const SNAPSHOT = BOOT !== null;

  // `commits` is one "sha<TAB>subject" per line, appended by `bl note --commit`.
  const commitLines = (c) =>
    (c.commits || "").split("\n").filter((l) => l.trim())
      .map((l) => { const i = l.indexOf("\t"); return i < 0 ? [l, ""] : [l.slice(0, i), l.slice(i + 1)]; });

  const COLUMNS = [
    { key: "new",         name: "New",         color: "var(--s-new)" },
    { key: "ready",       name: "Ready",       color: "var(--s-ready)" },
    { key: "in_progress", name: "In progress", color: "var(--s-prog)" },
    { key: "blocked",     name: "Blocked",     color: "var(--s-block)", optional: true },
    { key: "done",        name: "Done",        color: "var(--s-done)" },
  ];
  const STATUS_VAR = { new: "new", ready: "ready", in_progress: "prog", blocked: "block", done: "done" };

  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k, d) => { try { const v = localStorage.getItem("bl." + k); return v === null ? d : v; } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem("bl." + k, v); } catch (e) {} },
  };
  const state = { cards: [], db: 0, label: "", q: "", sort: store.get("sort", "priority"),
                  doneLimit: Number(store.get("done", "20")) || 0, selected: null,
                  project: "", projects: [], scoped: null, charts: store.get("charts", "0") === "1",
                  hiddenCli: [], hidden: new Set() };
  // Projects this viewer has hidden on the store-wide page (by name). The
  // durable, every-browser version is `bl project hide`, which leaves the
  // cards out of the page altogether.
  try { state.hidden = new Set(JSON.parse(store.get("hiddenProjects", "[]"))); } catch (e) {}
  const saveHidden = () => store.set("hiddenProjects", JSON.stringify([...state.hidden].sort()));

  // The filters live in the query string so a link keeps them; the project
  // also in localStorage so the page reopens where it was left.
  const params = new URLSearchParams(location.search);
  if (params.has("project")) state.project = params.get("project");
  else state.project = store.get("project", "");
  state.q = params.get("q") || "";
  state.label = params.get("tag") || "";

  // --- helpers -------------------------------------------------------------

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // SQLite stores 'YYYY-MM-DD HH:MM:SS' in UTC.
  const parseTs = (s) => {
    if (!s) return null;
    const d = new Date(s.replace(" ", "T") + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? "" : "Z"));
    return isNaN(d) ? null : d;
  };

  const agoMs = (ms) => {
    const secs = Math.max(0, ms / 1000);
    if (secs < 90) return Math.round(secs) + "s ago";
    if (secs < 5400) return Math.round(secs / 60) + "m ago";
    if (secs < 172800) return Math.round(secs / 3600) + "h ago";
    return Math.round(secs / 86400) + "d ago";
  };
  const ago = (s) => { const d = parseTs(s); return d ? agoMs(Date.now() - d.getTime()) : ""; };

  const full = (s) => {
    const d = parseTs(s);
    return d ? d.toLocaleString() : "—";
  };

  // Priority heat: cold → hot across the 0–10000 range the CLI uses.
  const heat = (p) => {
    const t = Math.min(1, Math.max(0, p / 10000));
    return `color-mix(in oklab, var(--heat-hot) ${Math.round(t * 100)}%, var(--heat-cold))`;
  };

  // Cards of the chosen project (or all), before the tag and search filters.
  // Hidden projects drop out of the all-projects view; picking one by name
  // (the header menu, a card link) still shows it.
  const shown = () => state.hidden.size && !state.scoped
    ? state.cards.filter((c) => !state.hidden.has(c.project)) : state.cards;
  const inProject = () =>
    state.project ? state.cards.filter((c) => c.project === state.project) : shown();
  const projectNames = () => [...new Set(state.cards.map((c) => c.project).filter(Boolean))].sort();

  // A label is a comma-separated tag list; the filter matches any one tag.
  const tagsOf = (label) => String(label || "").split(",").map((t) => t.trim()).filter(Boolean);

  // Search: every word must appear somewhere on the card — title, notes,
  // outcome, tags, id, who holds it, what it waits on.
  const terms = () => state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hay = (c) => c._hay || (c._hay = [
    "#" + c.id, c.title, c.label, c.notes, c.outcome, c.claimed_by, c.blocked_on, c.project, c.status,
    ...(c.entries || []).map((n) => n.body + " " + (n.author || "")),
  ].map((x) => String(x || "")).join("\n").toLowerCase());
  const matches = (c, ts) => ts.every((t) => hay(c).includes(t));

  const filtering = () => !!(state.q.trim() || state.label);

  const visible = () => {
    let cards = inProject();
    if (state.label) cards = cards.filter((c) => tagsOf(c.label).includes(state.label));
    const ts = terms();
    if (ts.length) cards = cards.filter((c) => matches(c, ts));
    return cards;
  };

  // Wrap every search hit in <mark>; escapes as it goes.
  const hl = (s, ts) => {
    s = String(s ?? "");
    if (!ts.length) return esc(s);
    const re = new RegExp(ts.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
    let out = "", last = 0, m;
    while ((m = re.exec(s))) {
      if (!m[0]) { re.lastIndex++; continue; }
      out += esc(s.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  };

  // When the title alone doesn't explain a hit, show the note line that does.
  const snippet = (c, ts) => {
    if (!ts.length) return "";
    const title = c.title.toLowerCase();
    if (ts.every((t) => title.includes(t))) return "";
    const lines = [
      ...(c.entries || []).map((n) => n.body),
      c.notes || "", c.outcome || "",
    ].join("\n").split("\n");
    const line = lines.find((l) => { const low = l.toLowerCase(); return ts.some((t) => low.includes(t)); });
    if (!line) return "";
    const low = line.toLowerCase();
    const at = Math.min(...ts.map((t) => low.indexOf(t)).filter((i) => i >= 0));
    const start = Math.max(0, at - 18);
    const cut = (start > 0 ? "…" : "") + line.slice(start, start + 160).trim();
    return `<div class="snippet" title="${esc(line)}">${hl(cut, ts)}</div>`;
  };

  // More than one project on screen: name it on every card.
  const spanning = () => !state.project && !state.scoped &&
    new Set(shown().map((c) => c.project).filter(Boolean)).size > 1;

  const sorters = {
    priority: (a, b) => b.priority - a.priority || String(a.created_at).localeCompare(String(b.created_at)),
    updated:  (a, b) => String(b.updated_at).localeCompare(String(a.updated_at)),
    created:  (a, b) => String(b.created_at).localeCompare(String(a.created_at)) || b.id - a.id,
  };

  // --- rendering -----------------------------------------------------------

  function renderStrip(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const prog = cards.filter((c) => c.status === "in_progress");
    const done = cards.filter((c) => c.status === "done");
    const agents = new Set(cards.filter((c) => c.claimed_by).map((c) => c.claimed_by));
    const avg = open.length
      ? Math.round(open.reduce((a, c) => a + c.priority, 0) / open.length)
      : 0;
    const top = open.filter((c) => c.status !== "blocked")
      .reduce((a, c) => (a && a.priority >= c.priority ? a : c), null);
    const dayAgo = Date.now() - 86400000;
    const done24 = done.filter((c) => {
      const d = parseTs(c.updated_at);
      return d && d.getTime() >= dayAgo;
    }).length;
    const stale = open.reduce((a, c) => {
      const d = parseTs(c.updated_at);
      return d && d.getTime() < a ? d.getTime() : a;
    }, Date.now());
    const blocked = cards.filter((c) => c.status === "blocked").length;

    const tiles = [
      ["Open", open.length, `${cards.filter((c) => c.status === "new").length} new · ${cards.filter((c) => c.status === "ready").length} ready${
        blocked ? ` · ${blocked} blocked` : ""}`],
      ["In progress", prog.length, agents.size ? `${agents.size} agent${agents.size > 1 ? "s" : ""} holding` : "unclaimed"],
      ["Top card", top ? "#" + top.id : "—", top ? `priority ${top.priority}` : "board clear", top ? top.id : null],
      ["Avg priority", avg, open.length ? "across open cards" : "nothing open"],
      ["Closed 24h", done24, `${done.length} done all time`],
      ["Oldest open", open.length ? agoMs(Date.now() - stale) : "—", "last touched"],
    ];

    $("strip").innerHTML = tiles.map(([k, v, sub, goto]) => `
      <div class="tile"${goto ? ` data-goto="${goto}" style="cursor:pointer" title="Open card #${goto}"` : ""}>
        <div class="label">${esc(k)}</div>
        <div class="v">${esc(v)}</div>
        <div class="sub">${esc(sub)}</div>
      </div>`).join("");
  }

  function renderProjectBars() {
    const panel = $("projectpanel");
    const names = [...new Set(shown().map((c) => c.project).filter(Boolean))];
    if (state.scoped || names.length < 2) { panel.hidden = true; return; }
    panel.hidden = false;
    const open = shown().filter((c) => c.status !== "done");
    const counts = new Map(names.map((n) => [n, 0]));
    for (const c of open) if (c.project) counts.set(c.project, counts.get(c.project) + 1);
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const max = Math.max(1, ...rows.map((r) => r[1]));
    $("projectbars").innerHTML = rows.map(([name, n]) => `
      <div class="bar-row pick ${state.project === name ? "on" : ""}" data-project="${esc(name)}" title="Show only ${esc(name)}">
        <div class="name">${esc(name)}</div>
        <div class="track"><div style="width:${(n / max) * 100}%;background:var(--accent)"></div></div>
        <div class="n">${n}</div>
        <button class="x quiet" data-hide="${esc(name)}" title="Hide ${esc(name)} from this page" aria-label="Hide ${esc(name)}">hide</button>
      </div>`).join("");
  }

  function renderLabelBars(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const counts = new Map();
    for (const c of open) {
      const tags = tagsOf(c.label);
      for (const k of (tags.length ? tags : ["(none)"])) counts.set(k, (counts.get(k) || 0) + 1);
    }
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const max = rows.length ? rows[0][1] : 1;

    $("labelbars").innerHTML = rows.length
      ? rows.map(([name, n]) => `
        <div class="bar-row ${name === "(none)" ? "" : "pick"} ${state.label === name ? "on" : ""}" data-tag="${esc(name)}" title="Show only ${esc(name)}">
          <div class="name" title="${esc(name)}">${esc(name)}</div>
          <div class="track"><div style="width:${(n / max) * 100}%;background:var(--accent)"></div></div>
          <div class="n">${n}</div>
        </div>`).join("")
      : `<div class="empty">No open cards.</div>`;
  }

  function renderHist(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const buckets = new Array(20).fill(0);
    for (const c of open) {
      const i = Math.min(19, Math.max(0, Math.floor(c.priority / 500)));
      buckets[i]++;
    }
    const max = Math.max(1, ...buckets);
    $("hist").innerHTML = buckets.map((n, i) => `
      <div style="height:${(n / max) * 100}%;background:${heat(i * 500 + 250)};opacity:${n ? 1 : 0.18}"
           title="${i * 500}–${i * 500 + 499}: ${n} card${n === 1 ? "" : "s"}"></div>`).join("");
  }

  function tagHTML(tags) {
    const shown = tags.slice(0, 3);
    const more = tags.length - shown.length;
    return shown.map((t) =>
      `<span class="tag ${state.label === t ? "on" : ""}" data-tag="${esc(t)}" title="Filter by ${esc(t)}">${esc(t)}</span>`).join("") +
      (more > 0 ? `<span class="tag more" title="${esc(tags.slice(3).join(", "))}">+${more}</span>` : "");
  }

  function cardHTML(c, ts) {
    const agentChip = c.claimed_by
      ? `<span class="chip agent" title="claimed by ${esc(c.claimed_by)}">@${esc(c.claimed_by)}</span>` : "";
    const projectChip = spanning() && c.project
      ? `<span class="proj" data-project="${esc(c.project)}" title="Show only ${esc(c.project)}">${esc(c.project)}</span>` : "";
    const blockedChip = c.status === "blocked" && c.blocked_on
      ? `<span class="chip block">on ${esc(c.blocked_on)}</span>` : "";
    const openBlockers = (c.links || []).filter((l) => l.rel === "blocked_by" && l.status !== "done");
    const waitChip = openBlockers.length
      ? `<span class="chip block" title="${esc(openBlockers.map((l) => "#" + l.id + " " + l.title).join("\n"))}">waits on ${
          openBlockers.map((l) => "#" + l.id).join(" ")}</span>` : "";
    return `
      <button class="card ${c.status === "done" ? "done" : ""}" data-id="${c.id}" style="--heat:${heat(c.priority)}"
              aria-current="${state.selected === c.id}">
        <div class="top">
          <span class="id">#${c.id}</span>
          ${projectChip}
          <span class="pri" title="priority ${c.priority}"><i></i>${c.priority}</span>
        </div>
        <div class="title">${hl(c.title, ts)}</div>
        ${snippet(c, ts)}
        <div class="meta">
          ${tagHTML(tagsOf(c.label))}${agentChip}${blockedChip}${waitChip}
          <span class="ago" title="${esc(full(c.updated_at))}">${esc(ago(c.updated_at))}</span>
        </div>
      </button>`;
  }

  function renderBoard(cards) {
    const ts = terms();
    const all = inProject();
    // The blocked column appears only while something is parked there.
    const cols = COLUMNS.filter((col) => !col.optional || all.some((c) => c.status === col.key));
    $("board").style.setProperty("--cols", cols.length);
    $("board").innerHTML = cols.map((col) => {
      let items = cards.filter((c) => c.status === col.key);
      const total = items.length;
      const unfiltered = filtering() ? all.filter((c) => c.status === col.key).length : total;
      if (col.key === "done") {
        items = [...items].sort(sorters.updated);
        items = items.slice(0, state.doneLimit);
      } else {
        items = [...items].sort(sorters[state.sort] || sorters.priority);
      }
      const hidden = total - items.length;
      const n = filtering() && unfiltered !== total ? `<b>${total}</b> / ${unfiltered}` : `${total}`;
      return `
        <section style="--col:${col.color}">
          <div class="col-head">
            <span class="label">${col.name}</span>
            <span class="n">${n}</span>
          </div>
          <div class="stack">
            ${items.map((c) => cardHTML(c, ts)).join("") ||
              `<div class="empty">${filtering() ? "No matches." : "Nothing here."}</div>`}
            ${hidden > 0 ? `<div class="empty">${hidden} older hidden</div>` : ""}
          </div>
        </section>`;
    }).join("");
  }

  function noteHTML(n) {
    return `<div class="note">
      <div class="who"><b>${esc(n.kind)}</b><span>${esc(full(n.created_at))}</span>${n.author ? `<span>· ${esc(n.author)}</span>` : ""}</div>
      <div class="body">${esc(n.body)}</div>
      ${n.commit_sha ? `<div class="sha">↳ ${esc(n.commit_sha)}${n.commit_subject ? " " + esc(n.commit_subject) : ""}</div>` : ""}
    </div>`;
  }

  function renderRail() {
    const rail = $("rail"), scrim = $("scrim");
    const c = state.cards.find((x) => x.id === state.selected);
    if (!c) {
      rail.hidden = true;
      scrim.hidden = true;
      return;
    }
    const sv = STATUS_VAR[c.status] || "new";
    const cli = `bl show ${c.id}${state.central || !state.dbPath ? "" : ` --db ${state.dbPath}`}`;
    rail.innerHTML = `
      <button class="close quiet" id="railclose" aria-label="Close">✕</button>
      <div>
        <div class="head">
          <span class="label">Card #${c.id}</span>
          <span class="status" style="--sc:var(--s-${sv});--sbg:var(--s-${sv}-bg)">${esc(c.status.replace("_", " "))}</span>
          ${c.project && (spanning() || !state.scoped) ? `<span class="label">${esc(c.project)}</span>` : ""}
        </div>
        <h2>${esc(c.title)}</h2>
      </div>
      <dl class="kv">
        ${c.project ? `<dt>Project</dt><dd>${esc(c.project)}</dd>` : ""}
        ${c.blocked_on ? `<dt>Blocked on</dt><dd style="color:var(--s-block)">${esc(c.blocked_on)}</dd>` : ""}
        <dt>Priority</dt><dd style="color:${heat(c.priority)}">${c.priority}</dd>
        <dt>Tags</dt><dd>${tagsOf(c.label).length ? tagsOf(c.label).map((t) => `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join(" ") : "—"}</dd>
        <dt>Claimed</dt><dd>${c.claimed_by ? esc("@" + c.claimed_by) + " · " + esc(full(c.claimed_at)) : "—"}</dd>
        ${c.legacy_id ? `<dt>Imported</dt><dd>was #${c.legacy_id} in the repo board</dd>` : ""}
        <dt>Created</dt><dd>${esc(full(c.created_at))}</dd>
        <dt>Updated</dt><dd>${esc(full(c.updated_at))} <span style="color:var(--ink-3)">(${esc(ago(c.updated_at))})</span></dd>
      </dl>
      ${c.outcome ? `<div class="block"><h3 class="label">Outcome</h3><pre>${esc(c.outcome)}</pre></div>` : ""}
      ${(c.entries && c.entries.length)
        ? `<div class="block"><h3 class="label">Notes <span style="color:var(--ink-3)">${c.entries.length}</span></h3><div class="notes">${
            c.entries.map(noteHTML).join("")}</div></div>`
        : c.notes ? `<div class="block"><h3 class="label">Notes</h3><pre>${esc(c.notes)}</pre></div>` : ""}
      ${commitLines(c).length ? `<div class="block"><h3 class="label">Commits</h3><pre class="cli">${
        commitLines(c).map(([sha, subject]) =>
          `<b>${esc(sha)}</b>${subject ? "  " + esc(subject) : ""}`).join("\n")
      }</pre></div>` : ""}
      ${(c.links && c.links.length) ? `<div class="block"><h3 class="label">Links</h3><pre>${
        ["blocked_by", "blocks", "child_of", "parent_of", "related"].map((rel) => {
          const items = c.links.filter((l) => l.rel === rel);
          if (!items.length) return "";
          const name = { blocked_by: "blocked by", blocks: "blocks", child_of: "child of", parent_of: "children", related: "related" }[rel];
          return `<b>${name}</b>  ${items.map((l) =>
            `<a href="#card-${l.id}" data-goto="${l.id}">#${l.id}</a> <span style="color:var(--ink-3)">${esc(l.status)}</span> ${esc(l.title)}`
          ).join("\n" + " ".repeat(name.length + 2))}`;
        }).filter(Boolean).join("\n")}</pre></div>` : ""}
      ${(c.events && c.events.length) ? `<div class="block"><h3 class="label">Timeline</h3><pre class="cli">${
        c.events.map((e) => {
          const flat = (s) => { const f = String(s).replace(/\n/g, " | "); return f.length > 120 ? f.slice(0, 117) + "..." : f; };
          const change = e.before && e.after ? `${esc(flat(e.before))} → ${esc(flat(e.after))}`
            : e.after ? `→ ${esc(flat(e.after))}` : e.before ? `${esc(flat(e.before))} →` : "";
          return `<span style="color:var(--ink-3)">${esc(e.at)}</span>  <b>${esc(e.kind)}</b>  ${change}${
            e.by ? ` <span style="color:var(--ink-3)">· ${esc(e.by)}</span>` : ""}`;
        }).join("\n")}</pre></div>` : ""}
      <div class="block">
        <h3 class="label">Inspect from the CLI <button class="copy quiet" id="copycli" title="Copy">copy</button></h3>
        <pre class="cli" id="clihint">${esc(cli)}</pre>
      </div>`;
    rail.hidden = false;
    scrim.hidden = false;
    $("railclose").addEventListener("click", close);
    $("copycli").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(cli); $("copycli").textContent = "copied"; }
      catch (e) { $("copycli").textContent = "select it"; }
      setTimeout(() => { const b = $("copycli"); if (b) b.textContent = "copy"; }, 1400);
    });
    rail.querySelectorAll("[data-goto]").forEach((a) =>
      a.addEventListener("click", (e) => { e.preventDefault(); select(Number(a.dataset.goto)); }));
  }

  function select(id) {
    state.selected = id;
    // Keep the card in the URL so a board view can be linked to directly.
    history.replaceState(null, "", location.pathname + location.search + (id ? "#card-" + id : ""));
    renderRail();
    renderBoard(visible());
  }

  function close() { select(null); }

  function renderCount(cards) {
    const el = $("count");
    if (!filtering()) { el.hidden = true; return; }
    const total = inProject().length;
    el.innerHTML = `${cards.length} of ${total} card${total === 1 ? "" : "s"} <button id="clearall" title="Clear search and tag">clear</button>`;
    el.hidden = false;
    $("clearall").addEventListener("click", () => { setQuery(""); setLabel(""); });
  }

  function renderProjectsMenu() {
    const wrap = $("projectswrap");
    const names = projectNames();
    const cli = state.hiddenCli;
    // Only the store-wide page spans projects; a project's own page has nothing to hide.
    if (state.scoped || (names.length < 2 && !cli.length)) { wrap.hidden = true; return; }
    wrap.hidden = false;
    const off = names.filter((n) => state.hidden.has(n)).length;
    $("projectsbtn").innerHTML = off || cli.length
      ? `projects · <b>${off + cli.length} hidden</b>` : "projects";
    const menu = $("projectsmenu");
    if (menu.hidden) return;
    const open = new Map();
    for (const c of state.cards) if (c.status !== "done" && c.project) open.set(c.project, (open.get(c.project) || 0) + 1);
    menu.innerHTML = `
      <div class="mhead">
        <span class="label">Shown on this page</span>
        <button data-all="show">all</button><button data-all="hide">none</button>
      </div>
      ${names.map((n) => `
        <label class="row ${state.hidden.has(n) ? "off" : ""}">
          <input type="checkbox" data-toggle="${esc(n)}" ${state.hidden.has(n) ? "" : "checked"} />
          <span class="nm" title="${esc(n)}">${esc(n)}</span>
          <span class="n">${open.get(n) || 0} open</span>
        </label>`).join("")}
      <div class="mnote">Remembered in this browser only.</div>
      ${cli.length ? `<div class="cli">Left off this page with <code>bl project hide</code>:
        <ul>${cli.map((n) => `<li><code>${esc(n)}</code></li>`).join("")}</ul>
        <div style="margin-top:4px">Bring one back with <code>bl project unhide NAME</code>.</div></div>` : ""}`;
  }

  function toggleProjectsMenu(force) {
    const menu = $("projectsmenu");
    const openIt = force === undefined ? menu.hidden : force;
    menu.hidden = !openIt;
    $("projectsbtn").setAttribute("aria-expanded", String(openIt));
    if (openIt) toggleProjectPick(false);
    renderProjectsMenu();
  }

  function setHidden(names, hide) {
    for (const n of names) { if (hide) state.hidden.add(n); else state.hidden.delete(n); }
    saveHidden();
    // Hiding the project in focus drops back to all projects.
    if (hide && names.includes(state.project)) { setProject(""); }
    const sel = state.cards.find((c) => c.id === state.selected);
    if (sel && !state.project && state.hidden.has(sel.project)) state.selected = null;
    syncLabelPicker();
    renderAll();
  }

  function renderTitle() {
    const name = state.scoped ? state.scoped.name
      : state.project ? state.project
      : state.projects.length === 1 ? state.projects[0].name
      : (state.projects.length > 1 || spanning()) ? "all projects" : "";
    const scope = $("scope");
    scope.textContent = name || "board";
    scope.hidden = !$("projectpickwrap").hidden;
    document.title = (name ? name + " · " : "") + "bl board";
  }

  function renderAll() {
    const cards = visible();
    renderTitle();
    renderProjectBars();
    renderStrip(cards);
    renderLabelBars(cards);
    renderHist(cards);
    renderBoard(cards);
    renderCount(cards);
    renderProjectsMenu();
    renderRail();
  }

  // --- data ----------------------------------------------------------------

  function syncLabelPicker() {
    const labels = [...new Set(inProject().flatMap((c) => tagsOf(c.label)))].sort();
    const pick = $("labelpick");
    const want = ["", ...labels].join("|");
    if (pick.dataset.sig !== want) {
      pick.dataset.sig = want;
      pick.innerHTML = `<option value="">all</option>` +
        labels.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
    }
    pick.value = labels.includes(state.label) ? state.label : "";
    state.label = pick.value;
  }

  function syncProjectPicker() {
    const wrap = $("projectpickwrap");
    const names = projectNames();
    if (state.scoped || names.length < 2) {
      toggleProjectPick(false);
      wrap.hidden = true;
      if (state.scoped) state.project = "";
      return;
    }
    wrap.hidden = false;
    if (state.project && !names.includes(state.project)) state.project = "";
    $("projectpicklabel").textContent = state.project || "all projects";
    renderProjectPick();
  }

  // The switcher's options, narrowed by its filter box. `active` is the row the
  // arrow keys are on; null means "start on the current project".
  const pickNav = { active: null, opts: [] };

  function renderProjectPick() {
    if ($("projectpickmenu").hidden) return;
    const q = $("projectfilter").value.trim().toLowerCase();
    const open = new Map();
    for (const c of state.cards) if (c.status !== "done" && c.project) open.set(c.project, (open.get(c.project) || 0) + 1);
    const allOpen = shown().filter((c) => c.status !== "done").length;
    pickNav.opts = [
      ...(q ? [] : [{ value: "", n: allOpen }]),
      ...projectNames().filter((n) => n.toLowerCase().includes(q)).map((n) => ({ value: n, n: open.get(n) || 0 })),
    ];
    if (pickNav.active === null) pickNav.active = Math.max(0, pickNav.opts.findIndex((o) => o.value === state.project));
    pickNav.active = Math.min(pickNav.active, pickNav.opts.length - 1);
    const list = $("projectlist");
    list.innerHTML = pickNav.opts.length ? pickNav.opts.map((o, i) => {
      const off = o.value && state.hidden.has(o.value);
      return `
        <div class="opt ${o.value ? "" : "all"} ${off ? "off" : ""} ${i === pickNav.active ? "active" : ""}"
             role="option" id="popt-${i}" data-pick="${esc(o.value)}" aria-selected="${o.value === state.project}">
          <span class="nm" title="${esc(o.value || "all projects")}">${esc(o.value || "all projects")}</span>
          <span class="n">${o.n} open${off ? " · hidden" : ""}</span>
        </div>`;
    }).join("") : `<div class="none">No project matches.</div>`;
    const active = $("popt-" + pickNav.active);
    $("projectfilter").setAttribute("aria-activedescendant", active ? active.id : "");
    if (active) active.scrollIntoView({ block: "nearest" });
  }

  function toggleProjectPick(force) {
    const menu = $("projectpickmenu");
    const openIt = force === undefined ? menu.hidden : force;
    if (openIt === !menu.hidden) return;
    menu.hidden = !openIt;
    $("projectpick").setAttribute("aria-expanded", String(openIt));
    if (!openIt) return;
    if (!$("projectsmenu").hidden) toggleProjectsMenu(false);
    $("projectfilter").value = "";
    pickNav.active = null;
    renderProjectPick();
    $("projectfilter").focus();
  }

  function chooseProject(name) {
    toggleProjectPick(false);
    $("projectpick").focus();
    setProject(name);
  }

  function setParam(key, value) {
    const url = new URL(location.href);
    if (value) url.searchParams.set(key, value); else url.searchParams.delete(key);
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  }

  function setProject(name) {
    state.project = name;
    store.set("project", name);
    setParam("project", name);
    // A card from another project stays selected only if it is still on screen.
    const sel = state.cards.find((c) => c.id === state.selected);
    if (sel && name && sel.project !== name) state.selected = null;
    syncProjectPicker();
    syncLabelPicker();
    renderAll();
  }

  function setLabel(tag) {
    state.label = tag;
    setParam("tag", tag);
    syncLabelPicker();
    renderAll();
  }

  let qTimer = null;
  function setQuery(q, { immediate = true } = {}) {
    state.q = q;
    $("q").value = q;
    $("qclear").hidden = !q;
    setParam("q", q.trim());
    clearTimeout(qTimer);
    if (immediate) renderAll(); else qTimer = setTimeout(renderAll, 60);
  }

  function setCharts(on) {
    state.charts = on;
    store.set("charts", on ? "1" : "0");
    $("panels").hidden = !on;
    $("chartstoggle").setAttribute("aria-pressed", String(on));
  }

  function apply(data) {
    state.cards = data.cards;
    state.dbPath = data.db.path;
    state.central = !!data.db.central;
    state.projects = data.projects || [];
    state.scoped = data.project || null;
    state.hiddenCli = data.hidden_projects || [];
    $("dbpath").innerHTML = `<bdi>${esc(data.db.path)}</bdi>`;
    $("dbpath").title = data.db.path;

    // A deep link into a project that is filtered out: follow the link.
    const linkedCard = state.cards.find((c) => c.id === state.selected);
    if (linkedCard && state.project && linkedCard.project !== state.project) {
      state.project = linkedCard.project || "";
    }
    if (linkedCard && !state.project && state.hidden.has(linkedCard.project)) {
      state.project = linkedCard.project;
    }

    const pick = $("dbpick");
    const sig = data.databases.map((d) => d.label).join("|");
    if (pick.dataset.sig !== sig) {
      pick.dataset.sig = sig;
      pick.innerHTML = data.databases
        .map((d) => `<option value="${d.index}">${esc(d.label)}</option>`).join("");
    }
    pick.value = String(data.db.index);
    pick.hidden = data.databases.length < 2;

    syncProjectPicker();
    syncLabelPicker();
    $("banner").hidden = true;
    renderAll();
  }

  function beat() {
    const p = $("pulse");
    p.classList.remove("beat");
    void p.offsetWidth;
    p.classList.add("beat");
  }

  async function load() {
    try {
      const res = await fetch(`/api/cards?db=${state.db}`, { cache: "no-store" });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      apply(data);
      beat();
      $("pulsetext").textContent = new Date().toLocaleTimeString();
    } catch (e) {
      const b = $("banner");
      b.textContent = "Can't read the backlog: " + e.message + " — is bl serve still running?";
      b.hidden = false;
      $("pulsetext").textContent = "stalled";
    }
  }

  // --- wiring --------------------------------------------------------------

  document.addEventListener("click", (e) => {
    const hide = e.target.closest("[data-hide]");
    if (hide) { e.stopPropagation(); setHidden([hide.dataset.hide], true); return; }
    const all = e.target.closest("[data-all]");
    if (all) { setHidden(projectNames(), all.dataset.all === "hide"); syncProjectPicker(); return; }
    if (e.target.closest("#projectpick")) { toggleProjectPick(); return; }
    const opt = e.target.closest("[data-pick]");
    if (opt) { chooseProject(opt.dataset.pick); return; }
    if (!$("projectpickmenu").hidden && !e.target.closest("#projectpickwrap")) toggleProjectPick(false);
    if (e.target.closest("#projectpickmenu")) return;
    if (e.target.closest("#projectsbtn")) { toggleProjectsMenu(); return; }
    if (!$("projectsmenu").hidden && !e.target.closest("#projectswrap")) toggleProjectsMenu(false);
    if (e.target.closest("#projectsmenu")) return;
    const tag = e.target.closest("[data-tag]");
    if (tag && (tag.classList.contains("tag") || tag.classList.contains("pick"))) {
      e.stopPropagation();
      const t = tag.dataset.tag;
      setLabel(state.label === t ? "" : t);
      return;
    }
    const proj = e.target.closest("[data-project]");
    if (proj) {
      e.stopPropagation();
      setProject(state.project === proj.dataset.project ? "" : proj.dataset.project);
      return;
    }
    const goto = e.target.closest(".tile[data-goto]");
    if (goto) { select(Number(goto.dataset.goto)); return; }
    const card = e.target.closest(".card");
    if (card) {
      const id = Number(card.dataset.id);
      select(state.selected === id ? null : id);
    }
  });

  $("projectsmenu").addEventListener("change", (e) => {
    const t = e.target.closest("[data-toggle]");
    if (!t) return;
    setHidden([t.dataset.toggle], !t.checked);
    syncProjectPicker();
  });

  $("scrim").addEventListener("click", close);
  $("help").addEventListener("click", () => { $("help").hidden = true; });
  $("helptoggle").addEventListener("click", () => { $("help").hidden = !$("help").hidden; });

  document.addEventListener("keydown", (e) => {
    const typing = e.target.matches("input, select, textarea");
    if (e.key === "Escape") {
      if (!$("help").hidden) { $("help").hidden = true; return; }
      if (!$("projectsmenu").hidden) { toggleProjectsMenu(false); $("projectsbtn").focus(); return; }
      if (state.selected !== null) { close(); return; }
      if (typing && e.target.id === "q") { if (state.q) setQuery(""); else e.target.blur(); return; }
      if (state.q) setQuery("");
      return;
    }
    if (typing) {
      if (e.key === "Enter" && e.target.id === "q") {
        const first = visible().filter((c) => c.status !== "done")[0] || visible()[0];
        if (first) select(first.id);
      }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "c") setCharts(!state.charts);
    else if (e.key === "g" && !$("projectpickwrap").hidden) { e.preventDefault(); toggleProjectPick(); }
    else if (e.key === "p" && !$("projectswrap").hidden) toggleProjectsMenu();
    else if (e.key === "?") $("help").hidden = !$("help").hidden;
    else if (e.key === "r" && SNAPSHOT && location.protocol === "file:") location.reload();
  });

  $("q").addEventListener("input", (e) => setQuery(e.target.value, { immediate: false }));
  $("qclear").addEventListener("click", () => { setQuery(""); $("q").focus(); });

  $("dbpick").addEventListener("change", (e) => {
    state.db = Number(e.target.value);
    state.selected = null;
    load();
  });
  $("projectfilter").addEventListener("input", () => {
    pickNav.active = $("projectfilter").value.trim() ? 0 : null;
    renderProjectPick();
  });
  $("projectfilter").addEventListener("keydown", (e) => {
    const n = pickNav.opts.length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (n) pickNav.active = (pickNav.active + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
      renderProjectPick();
    } else if (e.key === "Enter") {
      if (n) chooseProject(pickNav.opts[pickNav.active].value);
    } else if (e.key === "Escape") {
      toggleProjectPick(false);
      $("projectpick").focus();
    } else if (e.key === "Tab") {
      toggleProjectPick(false);
      return;
    } else return;
    e.preventDefault();
    e.stopPropagation();
  });
  $("labelpick").addEventListener("change", (e) => setLabel(e.target.value));
  $("sortpick").addEventListener("change", (e) => {
    state.sort = e.target.value;
    store.set("sort", state.sort);
    renderBoard(visible());
  });
  $("donepick").addEventListener("change", (e) => {
    state.doneLimit = Number(e.target.value);
    store.set("done", String(state.doneLimit));
    renderBoard(visible());
  });
  $("chartstoggle").addEventListener("click", () => setCharts(!state.charts));

  $("themetoggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    store.set("theme", next);
  });
  { const t = store.get("theme", ""); if (t) document.documentElement.setAttribute("data-theme", t); }

  // Column heads stick just under the header, whatever height it wraps to.
  const fitHeader = () => document.documentElement.style.setProperty("--header-h", $("header").offsetHeight + "px");
  new ResizeObserver(fitHeader).observe($("header"));
  fitHeader();

  // Initial control state from the URL and the remembered settings.
  $("q").value = state.q;
  $("qclear").hidden = !state.q;
  $("sortpick").value = sorters[state.sort] ? state.sort : "priority";
  state.sort = $("sortpick").value;
  $("donepick").value = String(state.doneLimit);
  if ($("donepick").value !== String(state.doneLimit)) { $("donepick").value = "20"; state.doneLimit = 20; }
  setCharts(state.charts);

  const linked = /^#card-(\d+)$/.exec(location.hash);
  if (linked) state.selected = Number(linked[1]);

  // A snapshot is rewritten by every `bl` write when auto-export is on, so when
  // it is served over http it can stay current simply by re-reading itself.
  // file:// can't fetch, so there it stays a point-in-time snapshot — the
  // header says how old it is and a click (or `r`) reloads it.
  async function reloadSnapshot() {
    try {
      const res = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const raw = doc.getElementById("bldata");
      const data = raw && JSON.parse(raw.textContent);
      if (!data) return;
      apply(data);
      $("pulsetext").textContent = data.generated_at + " UTC";
      beat();
    } catch (e) {
      /* keep showing what we have */
    }
  }

  if (SNAPSHOT) {
    const live = location.protocol !== "file:";
    const p = $("pulse");
    if (!live) {
      p.classList.add("frozen", "reload");
      p.title = "Snapshot written " + full(BOOT.generated_at) + ". Click or press r to reload.";
      const age = () => { $("pulsetext").textContent = "snapshot · " + ago(BOOT.generated_at); };
      age();
      setInterval(age, 15000);
      p.addEventListener("click", () => location.reload());
    } else {
      $("pulsetext").textContent = BOOT.generated_at + " UTC";
    }
    apply(BOOT);
    if (live) setInterval(reloadSnapshot, 5000);
  } else {
    load();
    setInterval(load, 5000);
  }
})();
</script>
</body>
</html>
