<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bl — backlog board</title>
<style>
  :root {
    color-scheme: light dark;

    /* Neutrals, biased cool-green toward the accent */
    --paper:    #E9EEEB;
    --surface:  #FAFCFB;
    --surface-2:#F1F5F3;
    --line:     #D2DBD6;
    --line-soft:#E1E8E4;
    --ink:      #131A17;
    --ink-2:    #48564F;
    --ink-3:    #6E7D75;

    --accent:      #14655A;
    --accent-soft: #D6E6E1;

    /* Status semantics — separate from the accent */
    --s-new:      #64748B;
    --s-new-bg:   #E5E9ED;
    --s-ready:    #14655A;
    --s-ready-bg: #D6E6E1;
    --s-prog:     #9A6510;
    --s-prog-bg:  #F3E6CB;
    --s-done:     #7C8A83;
    --s-done-bg:  #E6EBE8;

    /* Priority heat ramp */
    --heat-cold: #7C93A0;
    --heat-hot:  #B8452F;

    --radius: 3px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:    #0D1311;
      --surface:  #141B18;
      --surface-2:#19221E;
      --line:     #26312C;
      --line-soft:#1E2822;
      --ink:      #E4EBE7;
      --ink-2:    #9DACA5;
      --ink-3:    #74847C;

      --accent:      #4FBFA9;
      --accent-soft: #14302A;

      --s-new:      #93A4B5;
      --s-new-bg:   #1D262D;
      --s-ready:    #4FBFA9;
      --s-ready-bg: #12302A;
      --s-prog:     #DCA53F;
      --s-prog-bg:  #322610;
      --s-done:     #6C7B74;
      --s-done-bg:  #1B2320;

      --heat-cold: #61818F;
      --heat-hot:  #E06A4E;
    }
  }

  :root[data-theme="dark"] {
    --paper:    #0D1311;
    --surface:  #141B18;
    --surface-2:#19221E;
    --line:     #26312C;
    --line-soft:#1E2822;
    --ink:      #E4EBE7;
    --ink-2:    #9DACA5;
    --ink-3:    #74847C;

    --accent:      #4FBFA9;
    --accent-soft: #14302A;

    --s-new:      #93A4B5;
    --s-new-bg:   #1D262D;
    --s-ready:    #4FBFA9;
    --s-ready-bg: #12302A;
    --s-prog:     #DCA53F;
    --s-prog-bg:  #322610;
    --s-done:     #6C7B74;
    --s-done-bg:  #1B2320;

    --heat-cold: #61818F;
    --heat-hot:  #E06A4E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  button, select {
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 9px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 14px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .wordmark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.02em;
  }
  .wordmark span { color: var(--accent); }

  .dbpath {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    max-width: 46ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* Truncate from the left so the filename end of the path stays visible;
       the inner <bdi> keeps the path itself reading left-to-right. */
    direction: rtl;
  }
  .dbpath bdi { unicode-bidi: isolate; }

  .spacer { flex: 1; }

  .pulse {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .pulse i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    display: block;
  }
  .pulse.beat i { animation: beat 1s ease-out; }
  /* A snapshot isn't live — say so rather than implying a heartbeat. */
  .pulse.frozen i { background: var(--ink-3); }
  @keyframes beat {
    0% { transform: scale(2.6); opacity: 0.35; }
    100% { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse.beat i { animation: none; }
  }

  /* ---------- summary strip ---------- */

  main { padding: 20px 22px 40px; }

  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .tile {
    background: var(--surface);
    padding: 12px 14px 13px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .tile .v {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 25px;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }
  .tile .sub { font-size: 11px; color: var(--ink-3); }

  /* ---------- distributions ---------- */

  .panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 13px 15px 15px;
  }
  .panel h2 { margin: 0 0 11px; font: inherit; }

  .bars { display: flex; flex-direction: column; gap: 7px; }
  .bar-row {
    display: grid;
    grid-template-columns: 11ch 1fr 4ch;
    align-items: center;
    gap: 10px;
  }
  .bar-row .name {
    font-family: var(--mono);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--ink-2);
  }
  .track {
    height: 7px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .track > div { height: 100%; border-radius: 999px; }
  .bar-row .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    text-align: right;
    color: var(--ink-2);
  }

  .hist {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 74px;
  }
  .hist > div {
    flex: 1;
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    position: relative;
  }
  .hist-axis {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  /* ---------- board ---------- */

  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(215px, 1fr));
    gap: 14px;
    align-items: start;
  }
  @media (max-width: 1000px) {
    .board { grid-template-columns: repeat(2, minmax(215px, 1fr)); }
  }
  @media (max-width: 620px) {
    .board { grid-template-columns: 1fr; }
  }

  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 0 2px 8px;
    border-bottom: 2px solid var(--col);
    margin-bottom: 10px;
  }
  .col-head .label { color: var(--col); }
  .col-head .n {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-3);
    margin-left: auto;
  }

  .stack { display: flex; flex-direction: column; gap: 8px; }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    border-left: 3px solid var(--heat);
    padding: 9px 11px 10px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.12s ease, transform 0.12s ease;
  }
  .card:hover { border-color: var(--line); border-left-color: var(--heat); transform: translateX(1px); }
  .card:hover .title { color: var(--accent); }
  .card[aria-current="true"] { box-shadow: inset 0 0 0 1px var(--accent); }

  .card .top {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .card .id {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
  }
  .card .pri {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    font-weight: 600;
    color: var(--heat);
    margin-left: auto;
  }
  .card .title {
    font-size: 13.5px;
    line-height: 1.35;
    text-wrap: pretty;
  }
  .card .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--line-soft);
  }
  .chip.agent {
    background: var(--s-prog-bg);
    color: var(--s-prog);
    border-color: transparent;
  }
  .chip.done { background: var(--s-done-bg); color: var(--s-done); border-color: transparent; }
  .ago { font-size: 10.5px; color: var(--ink-3); margin-left: auto; }

  .empty {
    padding: 14px 2px;
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
  }

  /* ---------- detail rail ---------- */

  .rail {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(430px, 92vw);
    background: var(--surface);
    border-left: 1px solid var(--line);
    padding: 20px 22px 40px;
    overflow-y: auto;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .rail[hidden] { display: none; }
  .rail .close { position: absolute; top: 14px; right: 16px; }
  .rail h2 {
    margin: 0;
    font-size: 19px;
    line-height: 1.3;
    text-wrap: balance;
    padding-right: 42px;
  }
  .kv {
    display: grid;
    grid-template-columns: 10ch 1fr;
    gap: 5px 12px;
    font-size: 12px;
  }
  .kv dt { color: var(--ink-3); font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding-top: 2px; }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }
  .block h3 { margin: 0 0 6px; font: inherit; }
  .block pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.28);
    z-index: 25;
  }
  .scrim[hidden] { display: none; }

  .banner {
    background: var(--s-prog-bg);
    color: var(--s-prog);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 16px;
  }
  .banner[hidden] { display: none; }
</style>
</head>
<body>

<header>
  <div class="wordmark">bl<span>/</span>board</div>
  <select id="dbpick" aria-label="Database"></select>
  <div class="dbpath" id="dbpath" title=""></div>
  <div class="spacer"></div>
  <label class="label" for="labelpick">label</label>
  <select id="labelpick" aria-label="Filter by label"><option value="">all</option></select>
  <label class="label" for="donepick">done</label>
  <select id="donepick" aria-label="Done cards shown">
    <option value="20">last 20</option>
    <option value="60">last 60</option>
    <option value="0">hide</option>
    <option value="99999">all</option>
  </select>
  <div class="pulse label" id="pulse"><i></i><span id="pulsetext">live</span></div>
  <button id="themetoggle" title="Toggle light / dark">◐</button>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section class="strip" id="strip" aria-label="Summary"></section>

  <div class="panels">
    <section class="panel">
      <h2 class="label">Open cards by label</h2>
      <div class="bars" id="labelbars"></div>
    </section>
    <section class="panel">
      <h2 class="label">Open priority distribution</h2>
      <div class="hist" id="hist"></div>
      <div class="hist-axis">
        <span class="label">0</span><span class="label">5000</span><span class="label">10000</span>
      </div>
    </section>
  </div>

  <section class="board" id="board" aria-label="Board"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="rail" id="rail" hidden aria-label="Card detail"></aside>

<script id="bldata" type="application/json">null</script>
<script>
(() => {
  "use strict";

  // `bl export` bakes the cards into the block above; when it holds data this
  // page is a snapshot and never talks to a server.
  const BOOT = JSON.parse(document.getElementById("bldata").textContent);
  const SNAPSHOT = BOOT !== null;

  // `commits` is one "sha<TAB>subject" per line, appended by `bl note --commit`.
  const commitLines = (c) =>
    (c.commits || "").split("\n").filter((l) => l.trim())
      .map((l) => { const i = l.indexOf("\t"); return i < 0 ? [l, ""] : [l.slice(0, i), l.slice(i + 1)]; });

  const COLUMNS = [
    { key: "new",         name: "New",         color: "var(--s-new)" },
    { key: "ready",       name: "Ready",       color: "var(--s-ready)" },
    { key: "in_progress", name: "In progress", color: "var(--s-prog)" },
    { key: "done",        name: "Done",        color: "var(--s-done)" },
  ];

  const $ = (id) => document.getElementById(id);
  const state = { cards: [], db: 0, label: "", doneLimit: 20, selected: null };

  // --- helpers -------------------------------------------------------------

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // SQLite stores 'YYYY-MM-DD HH:MM:SS' in UTC.
  const parseTs = (s) => {
    if (!s) return null;
    const d = new Date(s.replace(" ", "T") + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? "" : "Z"));
    return isNaN(d) ? null : d;
  };

  const ago = (s) => {
    const d = parseTs(s);
    if (!d) return "";
    const secs = Math.max(0, (Date.now() - d.getTime()) / 1000);
    if (secs < 90) return Math.round(secs) + "s ago";
    if (secs < 5400) return Math.round(secs / 60) + "m ago";
    if (secs < 172800) return Math.round(secs / 3600) + "h ago";
    return Math.round(secs / 86400) + "d ago";
  };

  const full = (s) => {
    const d = parseTs(s);
    return d ? d.toLocaleString() : "—";
  };

  // Priority heat: cold → hot across the 0–10000 range the CLI uses.
  const heat = (p) => {
    const t = Math.min(1, Math.max(0, p / 10000));
    return `color-mix(in oklab, var(--heat-hot) ${Math.round(t * 100)}%, var(--heat-cold))`;
  };

  const visible = () => {
    let cards = state.cards;
    if (state.label) cards = cards.filter((c) => c.label === state.label);
    return cards;
  };

  // --- rendering -----------------------------------------------------------

  function renderStrip(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const prog = cards.filter((c) => c.status === "in_progress");
    const done = cards.filter((c) => c.status === "done");
    const agents = new Set(cards.filter((c) => c.claimed_by).map((c) => c.claimed_by));
    const avg = open.length
      ? Math.round(open.reduce((a, c) => a + c.priority, 0) / open.length)
      : 0;
    const top = open.reduce((a, c) => (a && a.priority >= c.priority ? a : c), null);
    const dayAgo = Date.now() - 86400000;
    const done24 = done.filter((c) => {
      const d = parseTs(c.updated_at);
      return d && d.getTime() >= dayAgo;
    }).length;
    const stale = open.reduce((a, c) => {
      const d = parseTs(c.updated_at);
      return d && d.getTime() < a ? d.getTime() : a;
    }, Date.now());

    const tiles = [
      ["Open", open.length, `${cards.filter((c) => c.status === "new").length} new · ${cards.filter((c) => c.status === "ready").length} ready`],
      ["In progress", prog.length, agents.size ? `${agents.size} agent${agents.size > 1 ? "s" : ""} holding` : "unclaimed"],
      ["Avg priority", avg, open.length ? "across open cards" : "nothing open"],
      ["Top card", top ? "#" + top.id : "—", top ? `priority ${top.priority}` : "board clear"],
      ["Closed 24h", done24, `${done.length} done all time`],
      ["Oldest open", open.length ? ago(new Date(stale).toISOString()) : "—", "last touched"],
    ];

    $("strip").innerHTML = tiles.map(([k, v, sub]) => `
      <div class="tile">
        <div class="label">${esc(k)}</div>
        <div class="v">${esc(v)}</div>
        <div class="sub">${esc(sub)}</div>
      </div>`).join("");
  }

  function renderLabelBars(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const counts = new Map();
    for (const c of open) {
      const k = c.label || "(none)";
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
    const max = rows.length ? rows[0][1] : 1;

    $("labelbars").innerHTML = rows.length
      ? rows.map(([name, n]) => `
        <div class="bar-row">
          <div class="name" title="${esc(name)}">${esc(name)}</div>
          <div class="track"><div style="width:${(n / max) * 100}%;background:var(--accent)"></div></div>
          <div class="n">${n}</div>
        </div>`).join("")
      : `<div class="empty">No open cards.</div>`;
  }

  function renderHist(cards) {
    const open = cards.filter((c) => c.status !== "done");
    const buckets = new Array(20).fill(0);
    for (const c of open) {
      const i = Math.min(19, Math.max(0, Math.floor(c.priority / 500)));
      buckets[i]++;
    }
    const max = Math.max(1, ...buckets);
    $("hist").innerHTML = buckets.map((n, i) => `
      <div style="height:${(n / max) * 100}%;background:${heat(i * 500 + 250)};opacity:${n ? 1 : 0.18}"
           title="${i * 500}–${i * 500 + 499}: ${n} card${n === 1 ? "" : "s"}"></div>`).join("");
  }

  function cardHTML(c) {
    const agentChip = c.claimed_by
      ? `<span class="chip agent">@${esc(c.claimed_by)}</span>` : "";
    const labelChip = c.label ? `<span class="chip">${esc(c.label)}</span>` : "";
    const outcomeChip = c.status === "done" && c.outcome
      ? `<span class="chip done">outcome</span>` : "";
    return `
      <button class="card" data-id="${c.id}" style="--heat:${heat(c.priority)}"
              aria-current="${state.selected === c.id}">
        <div class="top">
          <span class="id">#${c.id}</span>
          ${labelChip}
          <span class="pri">${c.priority}</span>
        </div>
        <div class="title">${esc(c.title)}</div>
        <div class="meta">
          ${agentChip}${outcomeChip}
          <span class="ago">${esc(ago(c.updated_at))}</span>
        </div>
      </button>`;
  }

  function renderBoard(cards) {
    $("board").innerHTML = COLUMNS.map((col) => {
      let items = cards.filter((c) => c.status === col.key);
      const total = items.length;
      if (col.key === "done") {
        items = [...items].sort((a, b) =>
          String(b.updated_at).localeCompare(String(a.updated_at)));
        items = items.slice(0, state.doneLimit);
      }
      const hidden = total - items.length;
      return `
        <section style="--col:${col.color}">
          <div class="col-head">
            <span class="label">${col.name}</span>
            <span class="n">${total}</span>
          </div>
          <div class="stack">
            ${items.map(cardHTML).join("") ||
              `<div class="empty">Nothing here.</div>`}
            ${hidden > 0 ? `<div class="empty">${hidden} older hidden</div>` : ""}
          </div>
        </section>`;
    }).join("");
  }

  function renderRail() {
    const rail = $("rail"), scrim = $("scrim");
    const c = state.cards.find((x) => x.id === state.selected);
    if (!c) {
      rail.hidden = true;
      scrim.hidden = true;
      return;
    }
    const statusColor = { new: "--s-new", ready: "--s-ready", in_progress: "--s-prog", done: "--s-done" }[c.status];
    rail.innerHTML = `
      <button class="close" id="railclose" aria-label="Close">✕</button>
      <div>
        <div class="label">Card #${c.id}</div>
        <h2>${esc(c.title)}</h2>
      </div>
      <dl class="kv">
        <dt>Status</dt><dd style="color:var(${statusColor})">${esc(c.status)}</dd>
        <dt>Priority</dt><dd style="color:${heat(c.priority)}">${c.priority}</dd>
        <dt>Label</dt><dd>${esc(c.label || "—")}</dd>
        <dt>Claimed</dt><dd>${c.claimed_by ? esc("@" + c.claimed_by) + " · " + esc(full(c.claimed_at)) : "—"}</dd>
        <dt>Created</dt><dd>${esc(full(c.created_at))}</dd>
        <dt>Updated</dt><dd>${esc(full(c.updated_at))} <span style="color:var(--ink-3)">(${esc(ago(c.updated_at))})</span></dd>
      </dl>
      ${(c.entries && c.entries.length)
        ? `<div class="block"><h3 class="label">Notes</h3><pre>${c.entries.map((n) =>
            `<b>[${esc(n.kind)}]</b> <span style="color:var(--ink-3)">${esc(n.created_at)}${
              n.author ? " · " + esc(n.author) : ""}</span>\n${esc(n.body)}${
              n.commit_sha ? `\n<span style="color:var(--ink-3)">↳ ${esc(n.commit_sha)}${
                n.commit_subject ? " " + esc(n.commit_subject) : ""}</span>` : ""}`
          ).join("\n\n")}</pre></div>`
        : c.notes ? `<div class="block"><h3 class="label">Notes</h3><pre>${esc(c.notes)}</pre></div>` : ""}
      ${commitLines(c).length ? `<div class="block"><h3 class="label">Commits</h3><pre>${
        commitLines(c).map(([sha, subject]) =>
          `<b>${esc(sha)}</b>${subject ? "  " + esc(subject) : ""}`).join("\n")
      }</pre></div>` : ""}
      ${c.outcome ? `<div class="block"><h3 class="label">Outcome</h3><pre>${esc(c.outcome)}</pre></div>` : ""}
      <div class="block">
        <h3 class="label">Inspect from the CLI</h3>
        <pre>bl show ${c.id}${state.dbPath ? ` --db ${state.dbPath}` : ""}</pre>
      </div>`;
    rail.hidden = false;
    scrim.hidden = false;
    $("railclose").addEventListener("click", close);
  }

  function select(id) {
    state.selected = id;
    // Keep the card in the URL so a board view can be linked to directly.
    history.replaceState(null, "", id ? "#card-" + id : location.pathname);
    renderRail();
    renderBoard(visible());
  }

  function close() { select(null); }

  function renderAll() {
    const cards = visible();
    renderStrip(cards);
    renderLabelBars(cards);
    renderHist(cards);
    renderBoard(cards);
    renderRail();
  }

  // --- data ----------------------------------------------------------------

  function syncLabelPicker() {
    const labels = [...new Set(state.cards.map((c) => c.label).filter(Boolean))].sort();
    const pick = $("labelpick");
    const want = ["", ...labels].join("|");
    if (pick.dataset.sig === want) return;
    pick.dataset.sig = want;
    pick.innerHTML = `<option value="">all</option>` +
      labels.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
    pick.value = labels.includes(state.label) ? state.label : "";
    state.label = pick.value;
  }

  function apply(data) {
    state.cards = data.cards;
    state.dbPath = data.db.path;
    $("dbpath").innerHTML = `<bdi>${esc(data.db.path)}</bdi>`;
    $("dbpath").title = data.db.path;

    const pick = $("dbpick");
    const sig = data.databases.map((d) => d.label).join("|");
    if (pick.dataset.sig !== sig) {
      pick.dataset.sig = sig;
      pick.innerHTML = data.databases
        .map((d) => `<option value="${d.index}">${esc(d.label)}</option>`).join("");
    }
    pick.value = String(data.db.index);
    pick.hidden = data.databases.length < 2;

    syncLabelPicker();
    $("banner").hidden = true;
    renderAll();
  }

  async function load() {
    try {
      const res = await fetch(`/api/cards?db=${state.db}`, { cache: "no-store" });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      apply(data);

      const p = $("pulse");
      p.classList.remove("beat");
      void p.offsetWidth;
      p.classList.add("beat");
      $("pulsetext").textContent = new Date().toLocaleTimeString();
    } catch (e) {
      const b = $("banner");
      b.textContent = "Can't read the backlog: " + e.message + " — is bl serve still running?";
      b.hidden = false;
      $("pulsetext").textContent = "stalled";
    }
  }

  // --- wiring --------------------------------------------------------------

  document.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) {
      const id = Number(card.dataset.id);
      select(state.selected === id ? null : id);
    }
  });

  $("scrim").addEventListener("click", close);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  $("dbpick").addEventListener("change", (e) => {
    state.db = Number(e.target.value);
    state.selected = null;
    load();
  });
  $("labelpick").addEventListener("change", (e) => {
    state.label = e.target.value;
    renderAll();
  });
  $("donepick").addEventListener("change", (e) => {
    state.doneLimit = Number(e.target.value);
    renderBoard(visible());
  });

  $("themetoggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  });

  const linked = /^#card-(\d+)$/.exec(location.hash);
  if (linked) state.selected = Number(linked[1]);

  // A snapshot is rewritten by every `bl` write when auto-export is on, so when
  // it is served over http it can stay current simply by re-reading itself.
  // file:// can't fetch, so there it stays a true point-in-time snapshot.
  async function reloadSnapshot() {
    try {
      const res = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const raw = doc.getElementById("bldata");
      const data = raw && JSON.parse(raw.textContent);
      if (!data) return;
      apply(data);
      $("pulsetext").textContent = data.generated_at + " UTC";
      const p = $("pulse");
      p.classList.remove("beat");
      void p.offsetWidth;
      p.classList.add("beat");
    } catch (e) {
      /* keep showing what we have */
    }
  }

  if (SNAPSHOT) {
    const live = location.protocol !== "file:";
    if (!live) document.getElementById("pulse").classList.add("frozen");
    $("pulsetext").textContent = (live ? "" : "snapshot · ") + BOOT.generated_at + " UTC";
    apply(BOOT);
    if (live) setInterval(reloadSnapshot, 5000);
  } else {
    load();
    setInterval(load, 5000);
  }
})();
</script>
</body>
</html>
